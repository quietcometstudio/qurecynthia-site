  :root {
    color-scheme: dark;
    --night: #0a0f1c;
    --line: #26324f;
    --cream: #f4ecd8;
    --soft: #b9c0d4;
    --gold: #f2c14e;
    --gold-ink: #2a1d05;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night) url("/img/wood.jpg") center / cover no-repeat;
    background-image: image-set(url("/img/wood-1600.webp") type("image/webp"), url("/img/wood.jpg") type("image/jpeg"));
    color: var(--cream);
    font: 17px/1.6 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
  }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(10,15,28,0.72); }
  main {
    position: relative;
    text-align: center;
    max-width: 560px;
    padding-block: 32px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .eyebrow { font: 600 13px/1 "Nunito", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
  h1 { font: 600 clamp(32px, 7vw, 54px)/1.08 "Fredoka", "Nunito", system-ui, sans-serif; margin: 0 0 14px; text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,0.55); }
  p { margin: 0 0 24px; color: var(--soft); }
  a.home {
    display: inline-block; padding: 11px 20px; border-radius: 999px;
    background: var(--gold); color: var(--gold-ink); text-decoration: none;
    font: 600 16px/1 "Fredoka", "Nunito", sans-serif; letter-spacing: 0.02em;
  }
  /* language switcher (footer) */
  [hidden] { display: none !important; }
  .langbar { padding-top: 14px; }
  .langsw { display: block; }
  .langsw summary { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; color: var(--cream); padding: 8px 12px; margin-left: -12px; border-radius: 10px; min-height: 40px; }
  .langsw summary::-webkit-details-marker { display: none; }
  .langsw summary::after { content: "\25BE"; color: var(--soft); }
  .langsw[open] summary::after { content: "\25B4"; }
  .langsw summary:hover { color: var(--lamp); }
  .langsw summary:focus-visible, .langsw a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .langsw svg { width: 18px; height: 18px; flex: none; }
  .langsw ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .langsw li { margin: 0; }
  .langsw li a { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--cream); text-decoration: none; font-size: 15px; line-height: 1.2; }
  .langsw li a:hover { border-color: var(--lamp); }
  .langsw li a[aria-current="true"] { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .langsw li a[aria-current="true"]::before { content: "\2713\00a0"; }
  /* pages whose letters the self-hosted Latin fonts do not cover: one system stack for everything, so no letter falls back mid-word (ja, ko, zh only) */
  html.sysfont, html.sysfont * { font-family: system-ui, "Segoe UI", Roboto, "Noto Sans", "Hiragino Sans", "Yu Gothic", "Malgun Gothic", "Apple SD Gothic Neo", "PingFang SC", "Microsoft YaHei", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans CJK KR", "Noto Sans CJK TC", sans-serif !important; }
  html.sysfont .eyebrow { letter-spacing: 0.04em; }
  /* Russian and Ukrainian: Fredoka has no Cyrillic, so everything set in Fredoka is set in Nunito instead and a heading never mixes two fonts */
  html[lang="ru"] :is(h1, h2, h3, .pill, .studio, .home, a.home), html[lang="uk"] :is(h1, h2, h3, .pill, .studio, .home, a.home) { font-family: "Nunito", system-ui, sans-serif; font-weight: 700; }

<body>
<main>
  <p class="eyebrow">Qurecynthia</p>
  <h1 id="nf-h">You've wandered off the map</h1>

  <a class="home" id="nf-a" href="/">Back to the home page</a>
</main>
<script>
(function () {
  try {

    var L = [{"c":"en","f":"","s":0,"t":"Off the map - Qurecynthia","h":"You've wandered off the map","p":"There's nothing on this path but fireflies. The road back to town is this way.","b":"Back to the home page","u":"/"},{"c":"fr","f":"fr","s":0,"t":"Hors de la carte - Qurecynthia","h":"Tu as quitté la carte","p":"Il n'y a rien sur ce chemin, à part des lucioles. La route du retour vers la ville est par ici.","b":"Retour à l'accueil","u":"/fr/"},{"c":"es-419","f":"es","s":0,"t":"Fuera del mapa - Qurecynthia","h":"Te saliste del mapa","p":"En este sendero no hay nada más que luciérnagas. El camino de vuelta al pueblo es por aquí.","b":"Volver a la página de inicio","u":"/es/"},{"c":"pt-BR","f":"pt-br","s":0,"t":"Fora do mapa - Qurecynthia","h":"Você saiu do mapa","p":"Não há nada neste caminho além de vaga-lumes. A estrada de volta para a cidade é por aqui.","b":"Voltar para a página inicial","u":"/pt-br/"},{"c":"de","f":"de","s":0,"t":"Abseits der Karte - Qurecynthia","h":"Du hast die Karte verlassen","p":"Auf diesem Pfad gibt es nichts außer Glühwürmchen. Der Weg zurück in die Stadt führt hier entlang.","b":"Zurück zur Startseite","u":"/de/"},{"c":"it","f":"it","s":0,"t":"Fuori dalla mappa - Qurecynthia","h":"Hai lasciato la mappa","p":"Su questo sentiero non c'è nient'altro che lucciole. La strada per tornare in città è da questa parte.","b":"Torna alla home page","u":"/it/"},{"c":"pl","f":"pl","s":0,"t":"Poza mapą - Qurecynthia","h":"Jesteś poza mapą","p":"Na tej ścieżce są tylko świetliki. Droga powrotna do miasta prowadzi tędy.","b":"Wróć na stronę główną","u":"/pl/"},{"c":"tr","f":"tr","s":0,"t":"Haritanın dışında - Qurecynthia","h":"Haritanın dışına çıktın","p":"Bu patikada ateşböceklerinden başka bir şey yok. Kasabaya dönen yol bu taraftan.","b":"Ana sayfaya dön","u":"/tr/"},{"c":"ru","f":"ru","s":0,"t":"За краем карты - Qurecynthia","h":"Ты за краем карты","p":"На этой тропе только светлячки. Дорога назад в город - в той стороне.","b":"Назад на главную страницу","u":"/ru/"},{"c":"uk","f":"uk","s":0,"t":"За краєм мапи - Qurecynthia","h":"Ти за краєм мапи","p":"На цій стежці лише світлячки. Дорога назад до міста - ось у цей бік.","b":"Назад на головну сторінку","u":"/uk/"},{"c":"ja","f":"ja","s":1,"t":"地図の外 - Qurecynthia","h":"地図の外に迷い込みました","p":"この道にはホタルしかいません。町への道はこちらです。","b":"ホームに戻る","u":"/ja/"},{"c":"ko","f":"ko","s":1,"t":"지도 밖 - Qurecynthia","h":"지도 밖으로 벗어났어요","p":"이 길에는 반딧불이밖에 없어요. 마을로 돌아가는 길은 이쪽이에요.","b":"홈으로 돌아가기","u":"/ko/"},{"c":"zh-Hans","f":"zh-hans","s":1,"t":"走出地图了 - Qurecynthia","h":"你走出地图了","p":"这条小路上只有萤火虫。回小镇的路在这边。","b":"返回首页","u":"/zh-hans/"},{"c":"zh-Hant","f":"zh-hant","s":1,"t":"走出地圖了 - Qurecynthia","h":"你走出地圖了","p":"這條小路上只有螢火蟲。回小鎮的路在這邊。","b":"回到首頁","u":"/zh-hant/"}];
    var seg = (location.pathname.split("/")[1] || "").toLowerCase();
    var pick = null, i, j;
    for (i = 0; i < L.length; i++) { if (L[i].f && L[i].f === seg) { pick = L[i]; break; } }
    if (!pick) {
      var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
      for (j = 0; j < prefs.length && !pick; j++) {
        var p = String(prefs[j]).toLowerCase(), base = p.split("-")[0], want = null;
        if (base === "zh") { want = /hant|tw|hk|mo/.test(p) ? "zh-hant" : "zh-hans"; }
        else if (base === "es") { want = "es-419"; }
        else if (base === "pt") { want = "pt-br"; }
        for (i = 0; i < L.length; i++) {
          var c = L[i].c.toLowerCase();
          if (want ? c === want : (c === p || c.split("-")[0] === base)) { pick = L[i]; break; }
        }
        if (!pick && base === "en") { break; }
      }
    }
    if (!pick || pick.c === "en") { return; }
    document.documentElement.lang = pick.c;
    if (pick.s) { document.documentElement.className = "sysfont"; }
    document.title = pick.t;
    document.getElementById("nf-h").textContent = pick.h;
    document.getElementById("nf-p").textContent = pick.p;
    var a = document.getElementById("nf-a");
    a.textContent = pick.b;
    a.href = pick.u;
  } catch (e) {}
})();
